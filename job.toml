# The same environment as speedrun-8xh100 (python:3.12, its requirements.txt, CUDA headers from pip wheels), on
# one H100: compiling on one GPU takes several minutes, then 20 training steps.
image = "python:3.12"
requirements = "requirements.txt"
timeout_s = 2700
# A preempted spot run starts over from scratch; SkyPilot may recover it up to this many times.
max_retries = 3

[resources]
cpus = "16+"
memory = "64+"
accelerators = "H100:1"
use_spot = true
